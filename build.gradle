// Security-pinned dependency versions, shared with :app via rootProject.ext.
//
// These libraries reach the build transitively through plugins (AGP lint,
// dependency-check) and through app dependencies (itextpdf:sign, Robolectric),
// always at versions with published advisories. Pinning them here keeps a single
// source of truth: every entry has been checked against OSV and has no known
// vulnerability at the version below. Bump deliberately, re-checking advisories.
buildscript {
    gradle.ext.securityPins = [
        'com.fasterxml.jackson.core:jackson-core'       : '2.22.3',
        'com.fasterxml.jackson.core:jackson-databind'   : '2.22.3',
        'com.fasterxml.jackson.core:jackson-annotations': '2.22',
        'com.fasterxml.jackson:jackson-bom'             : '2.22.3',
        'org.bouncycastle:bcprov-jdk18on'               : '1.86',
        'org.bouncycastle:bcpkix-jdk18on'               : '1.86',
        'org.jdom:jdom2'                                : '2.0.6.1',
        'org.bitbucket.b_c:jose4j'                      : '0.9.7',
        'org.apache.httpcomponents:httpclient'          : '4.5.14',
        'org.apache.commons:commons-lang3'              : '3.20.0',
    ]

    // Plugins, AGP, lint and dependency-check resolve through this classpath, so
    // its vulnerable transitives need pinning separately from :app.
    configurations.classpath {
        resolutionStrategy {
            gradle.ext.securityPins.each { module, version ->
                force "$module:$version"
            }
        }
    }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '9.0.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0' apply false
    id 'com.android.library' version '9.4.0' apply false
    id 'com.android.legacy-kapt' version '9.0.0' apply false
    id 'com.google.dagger.hilt.android' version '2.59' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.0' apply false
    // Add OWASP Dependency-Check plugin to allow local vulnerability scanning
    id 'org.owasp.dependencycheck' version '13.0.0' apply false
    id 'com.github.ben-manes.versions' version '0.64.0' apply false
}

// Configure dependency-check for subprojects when applied
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('org.owasp.dependencycheck')) {
            project.dependencyCheck {
                // Generate all report formats; output lives in the module build reports
                formats = ['HTML', 'XML']
                outputDirectory = "${project.buildDir}/reports/dependency-check"
                // Do not fail the build by default; we'll use reports to triage findings
                failBuildOnCVSS = 0.0
                // Reduce noisy analyzers in Android projects
                analyzers {
                    assemblyEnabled = false
                    nodeEnabled = false
                }
                // The NVD API rejects requests without a key, and an empty key is
                // treated as invalid. Only enable the feed update when a key is set;
                // otherwise analyse from cached data.
                def nvdApiKey = System.getenv('NVD_API_KEY')
                if (nvdApiKey) {
                    autoUpdate = true
                    nvd.apiKey = nvdApiKey
                } else {
                    autoUpdate = false
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}