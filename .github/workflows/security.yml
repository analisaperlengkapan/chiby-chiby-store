name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2"
          else
            echo "sdkmanager not found at latest, trying 7.0 path"
            yes | /usr/local/lib/android/sdk/cmdline-tools/7.0/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check dependencies for vulnerabilities
        continue-on-error: true
        env:
          # NVD now requires an API key for bulk downloads. Configure this secret in repository settings.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY}" ]; then
            ./gradlew dependencyCheckAggregate --no-daemon || true
          else
            echo "NVD API key not set — skipping NVD feed update and running dependency-check using local/previous data (report may be incomplete)."
            ./gradlew dependencyCheckAggregate -DdependencyCheck.skipUpdate=true --no-daemon || true
          fi

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: app/build/reports/dependency-check/**/*.html
          retention-days: 30

